name: E2E (live site)

# After every push to main, wait until the production site serves that exact commit (Vercel
# deploys main automatically; /api/health reports the deployed commit), then run the HTTP smoke
# tests against it. Also runs daily as an uptime check, and by hand from the Actions tab.
# (Vercel reports builds as commit statuses here, not GitHub Deployments, so `deployment_status`
# never fires; found when the first production merge didn't trigger the old version.)
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-live
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke tests against the deployed site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: https://ai-support-ops-agent.vercel.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Wait for this commit to be live
        if: github.event_name == 'push'
        env:
          WANT: ${{ github.sha }}
        run: |
          want="${WANT:0:7}"
          for i in $(seq 1 40); do
            live=$(curl -fsS "$E2E_BASE_URL/api/health" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).commit??"")}catch{console.log("")}})')
            if [ "$live" = "$want" ]; then echo "live: $live"; exit 0; fi
            echo "waiting for $want (live: ${live:-unknown})"; sleep 15
          done
          echo "::error::production did not serve $want within 10 minutes"; exit 1
      - run: npm run e2e
